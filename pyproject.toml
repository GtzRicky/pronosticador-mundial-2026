[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quiniela-mundial-2026"
version = "0.1.0"
description = "Pronosticador local-first para resultados exactos del Mundial 2026"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
