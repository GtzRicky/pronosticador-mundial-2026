[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quiniela-mundial-2026"
version = "0.1.0"
description = "Pronosticador local-first para resultados exactos del Mundial 2026"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = [
    "data",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
follow_imports = "silent"
allow_untyped_defs = true
check_untyped_defs = false
exclude = [
    "^src/quiniela/(?!(__init__|cache|poisson_model|ratings|name_maps)\\.py$|domain/|application/|ports/|adapters/|infrastructure/).*",
]

[tool.coverage.run]
source = ["quiniela"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
